AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hayder Core - project memory and continue API

Resources:
  HayderMemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: record_key
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: record_key
          KeyType: RANGE

  HayderCoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          HAYDER_TABLE: !Ref HayderMemoryTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt HayderMemoryTable.Arn
      Events:
        Health:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
        SaveProjectMemory:
          Type: HttpApi
          Properties:
            Path: /memory/project
            Method: POST
        ContinueProject:
          Type: HttpApi
          Properties:
            Path: /continue/{project}
            Method: GET

Outputs:
  HayderApiUrl:
    Description: Hayder Core HTTP API URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  HayderTableName:
    Description: DynamoDB memory table
    Value: !Ref HayderMemoryTable
