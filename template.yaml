AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Hayder Core - AI, memory, approvals, AWS read-only, Gmail read-only, authentication and voice

Parameters:

  XorwiaBillingBaseUrl:
    Type: String
    Default: "https://xorwia.com"

  HayderPublicBaseUrl:
    Type: String
    Default: "https://xorwia.com/hayder"

  CognitoDomainPrefix:
    Type: String
    Default: "hayder-xorwia-auth"

  HayderCustomVoiceCallbackUrl:
    Type: String
    Default: "https://xorwia.com/hayder/voice"

  HayderDirectApiVoiceCallbackUrl:
    Type: String
    Default: ""
    Description: Optional direct execute-api /voice callback URL (passed as parameter to avoid circular dependency between HayderUserPoolClient and HayderApi).

  FounderGoogleSubject:
    Type: String
    Default: ""
    Description: Explicit allowlisted Google provider subject (sub) mapped to the founder native Cognito user.

  FounderGoogleEmail:
    Type: String
    Default: ""
    Description: Expected verified Google email for the allowlisted founder Google login.

  FounderNativeUsername:
    Type: String
    Default: ""
    Description: Known CONFIRMED native Cognito Username for the founder account.

  FounderNativeSub:
    Type: String
    Default: ""
    Description: Known native Cognito sub UUID for the founder account (verified before linking and used to pin canonical storage keys).

  FounderNativeEmail:
    Type: String
    Default: ""
    Description: Existing verified native Cognito email for the founder account (canonical partition key for Hayder memory, approvals and Gmail OAuth).

  AllowFounderCrossEmailLink:
    Type: String
    Default: "false"
    AllowedValues:
      - "false"
      - "true"
    Description: Explicit opt-in required to allow cross-email founder Google linking (fails closed by default to prevent silent Cognito email attribute overwrite).

Conditions:
  HasDirectApiVoiceCallbackUrl: !Not [!Equals [!Ref HayderDirectApiVoiceCallbackUrl, ""]]

Resources:

  HayderPreSignUpFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  HayderPreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: pre_signup.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt HayderPreSignUpFunctionRole.Arn
      Environment:
        Variables:
          FOUNDER_GOOGLE_SUBJECT: !Ref FounderGoogleSubject
          FOUNDER_GOOGLE_EMAIL: !Ref FounderGoogleEmail
          FOUNDER_NATIVE_USERNAME: !Ref FounderNativeUsername
          FOUNDER_NATIVE_SUB: !Ref FounderNativeSub
          FOUNDER_NATIVE_EMAIL: !Ref FounderNativeEmail
          ALLOW_FOUNDER_CROSS_EMAIL_LINK: !Ref AllowFounderCrossEmailLink

  HayderUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: hayder-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      LambdaConfig:
        PreSignUp: !GetAtt HayderPreSignUpFunction.Arn

  HayderPreSignUpCognitoPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: HayderPreSignUpCognitoLinkPolicy
      Roles:
        - !Ref HayderPreSignUpFunctionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cognito-idp:ListUsers
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminLinkProviderForUser
            Resource: !GetAtt HayderUserPool.Arn

  HayderPreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HayderPreSignUpFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt HayderUserPool.Arn

  HayderUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref HayderUserPool

  # Cognito Google Federation IdP (Sign-in only: openid email profile).
  # Uses AWS Secrets Manager dynamic references (secret: hayder/google/federation)
  # so real OAuth credentials never enter git, parameters, or CLI history.
  # Separate from workspace Gmail/Calendar OAuth (/oauth/google/connect).
  # PreSignUp trigger fails closed on email-only matches and links only
  # explicitly allowlisted verified Google subjects to confirmed native users.
  HayderGoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref HayderUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: "{{resolve:secretsmanager:hayder/google/federation:SecretString:client_id}}"
        client_secret: "{{resolve:secretsmanager:hayder/google/federation:SecretString:client_secret}}"
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  HayderUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: HayderGoogleIdentityProvider
    Properties:
      ClientName: hayder-client
      UserPoolId: !Ref HayderUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
        - Google
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Ref HayderCustomVoiceCallbackUrl
        - "https://www.xorwia.com/hayder/voice"
        - !If
          - HasDirectApiVoiceCallbackUrl
          - !Ref HayderDirectApiVoiceCallbackUrl
          - !Ref AWS::NoValue
      LogoutURLs:
        - !Ref HayderCustomVoiceCallbackUrl
        - "https://www.xorwia.com/hayder/voice"
        - !If
          - HasDirectApiVoiceCallbackUrl
          - !Ref HayderDirectApiVoiceCallbackUrl
          - !Ref AWS::NoValue

  HayderApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: HayderJwtAuthorizer
        Authorizers:
          HayderJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${HayderUserPool}"
              audience:
                - !Ref HayderUserPoolClient

  HayderMemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: record_key
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: record_key
          KeyType: RANGE

  HayderApprovalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: approval_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: approval_id
          KeyType: RANGE

  HayderCoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 30

      Environment:
        Variables:
          HAYDER_TABLE: !Ref HayderMemoryTable
          HAYDER_APPROVAL_TABLE: !Ref HayderApprovalTable
          OPENAI_SECRET_NAME: hayder/openai-api-key
          OPENAI_MODEL: gpt-5.6-luna
          GOOGLE_CLIENT_ID_SECRET: hayder/google/client-id
          GOOGLE_CLIENT_SECRET_SECRET: hayder/google/client-secret
          XORWIA_BILLING_BASE_URL: !Ref XorwiaBillingBaseUrl
          XORWIA_BILLING_SECRET_NAME: hayder/xorwia/billing-service-secret
          HAYDER_PUBLIC_BASE_URL: !Ref HayderPublicBaseUrl
          FOUNDER_NATIVE_SUB: !Ref FounderNativeSub
          FOUNDER_NATIVE_EMAIL: !Ref FounderNativeEmail

      Policies:
        - Statement:

            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt HayderMemoryTable.Arn

            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt HayderApprovalTable.Arn

            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/openai-api-key-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/google/client-id-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/google/client-secret-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/xorwia/billing-service-secret-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/google/users/*"

            - Effect: Allow
              Action:
                - secretsmanager:CreateSecret
                - secretsmanager:PutSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/google/users/*"

            - Effect: Allow
              Action:
                - lambda:GetFunctionConfiguration
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-HayderCoreFunction-*"

      Events:

        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

        SaveProjectMemory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /memory/project
            Method: POST

        ContinueProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /continue/{project}
            Method: GET

        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /chat
            Method: POST

        GmailConnect:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /oauth/google/connect
            Method: GET

        GmailCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /oauth/google/callback
            Method: GET
            Auth:
              Authorizer: NONE

        CreateApproval:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /approval/create
            Method: POST

        ApproveAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /approval/{approval_id}/approve
            Method: POST

        RejectAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /approval/{approval_id}/reject
            Method: POST

        BillingCheckout:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /billing/checkout
            Method: POST

        BillingStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /billing/status
            Method: GET

  HayderAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: auth.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 10

      Environment:
        Variables:
          COGNITO_CLIENT_ID: !Ref HayderUserPoolClient

      Events:

        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE

        Refresh:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /auth/refresh
            Method: POST
            Auth:
              Authorizer: NONE

  HayderVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: voice.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 5

      Environment:
        Variables:
          COGNITO_DOMAIN: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
          COGNITO_CLIENT_ID: !Ref HayderUserPoolClient
          HAYDER_PUBLIC_BASE_URL: !Ref HayderPublicBaseUrl

      Events:

        HayderRootPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /
            Method: GET
            Auth:
              Authorizer: NONE

        FeaturesPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /features
            Method: GET
            Auth:
              Authorizer: NONE

        HowItWorksPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /how-it-works
            Method: GET
            Auth:
              Authorizer: NONE

        SecurityPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /security
            Method: GET
            Auth:
              Authorizer: NONE

        PricingPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /pricing
            Method: GET
            Auth:
              Authorizer: NONE

        AboutPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /about
            Method: GET
            Auth:
              Authorizer: NONE

        SupportPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /support
            Method: GET
            Auth:
              Authorizer: NONE

        VoicePage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /voice
            Method: GET
            Auth:
              Authorizer: NONE

        HayderPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /hayder
            Method: GET
            Auth:
              Authorizer: NONE

        HayderFeaturesPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /hayder/features
            Method: GET
            Auth:
              Authorizer: NONE

        HayderHowItWorksPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /hayder/how-it-works
            Method: GET
            Auth:
              Authorizer: NONE

        HayderSecurityPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /hayder/security
            Method: GET
            Auth:
              Authorizer: NONE

        HayderPricingPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /hayder/pricing
            Method: GET
            Auth:
              Authorizer: NONE

        HayderAboutPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /hayder/about
            Method: GET
            Auth:
              Authorizer: NONE

        HayderSupportPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /hayder/support
            Method: GET
            Auth:
              Authorizer: NONE

        PrivacyPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /privacy
            Method: GET
            Auth:
              Authorizer: NONE

        TermsPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /terms
            Method: GET
            Auth:
              Authorizer: NONE

        BillingSuccessPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /billing/success
            Method: GET
            Auth:
              Authorizer: NONE

        BillingCancelPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /billing/cancel
            Method: GET
            Auth:
              Authorizer: NONE

Outputs:

  HayderApiUrl:
    Value: !Sub "https://${HayderApi}.execute-api.${AWS::Region}.amazonaws.com"

  HayderWebUrl:
    Value: !Sub "https://${HayderApi}.execute-api.${AWS::Region}.amazonaws.com/hayder"

  HayderVoiceUrl:
    Value: !Sub "https://${HayderApi}.execute-api.${AWS::Region}.amazonaws.com/voice"

  HayderTableName:
    Value: !Ref HayderMemoryTable

  HayderApprovalTableName:
    Value: !Ref HayderApprovalTable

  HayderUserPoolId:
    Value: !Ref HayderUserPool

  HayderUserPoolClientId:
    Value: !Ref HayderUserPoolClient

  HayderCognitoHostedUiDomain:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

  HayderCognitoGoogleIdpRedirectUri:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
