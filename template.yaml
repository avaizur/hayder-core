AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Hayder Core - AI, memory, approvals, AWS read-only, Gmail read-only, authentication and voice

Resources:

  HayderUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: hayder-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  HayderUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: hayder-client
      UserPoolId: !Ref HayderUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  HayderApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: HayderJwtAuthorizer
        Authorizers:
          HayderJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${HayderUserPool}"
              audience:
                - !Ref HayderUserPoolClient

  HayderMemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: record_key
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: record_key
          KeyType: RANGE

  HayderApprovalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: approval_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: approval_id
          KeyType: RANGE

  HayderCoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 30

      Environment:
        Variables:
          HAYDER_TABLE: !Ref HayderMemoryTable
          HAYDER_APPROVAL_TABLE: !Ref HayderApprovalTable
          OPENAI_SECRET_NAME: hayder/openai-api-key
          OPENAI_MODEL: gpt-5.6-luna
          GOOGLE_CLIENT_ID_SECRET: hayder/google/client-id
          GOOGLE_CLIENT_SECRET_SECRET: hayder/google/client-secret
          HAYDER_GOOGLE_LIMIT_BASIC: "1"
          HAYDER_GOOGLE_LIMIT_PRO: "3"
          HAYDER_GOOGLE_LIMIT_BUSINESS: "10"

      Policies:
        - Statement:

            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt HayderMemoryTable.Arn

            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt HayderApprovalTable.Arn

            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/openai-api-key-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/google/client-id-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/google/client-secret-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/google/users/*"

            - Effect: Allow
              Action:
                - secretsmanager:CreateSecret
                - secretsmanager:PutSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/google/users/*"

            - Effect: Allow
              Action:
                - lambda:GetFunctionConfiguration
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-HayderCoreFunction-*"

      Events:

        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

        SaveProjectMemory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /memory/project
            Method: POST

        ContinueProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /continue/{project}
            Method: GET

        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /chat
            Method: POST

        AccountPlan:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /account/plan
            Method: POST

        GoogleAccounts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /google/accounts
            Method: GET

        GmailConnect:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /oauth/google/connect
            Method: GET

        GmailCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /oauth/google/callback
            Method: GET
            Auth:
              Authorizer: NONE

        CreateApproval:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /approval/create
            Method: POST

        ApproveAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /approval/{approval_id}/approve
            Method: POST

        RejectAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /approval/{approval_id}/reject
            Method: POST

  HayderAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: auth.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 10

      Environment:
        Variables:
          COGNITO_CLIENT_ID: !Ref HayderUserPoolClient

      Events:

        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE

        Refresh:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /auth/refresh
            Method: POST
            Auth:
              Authorizer: NONE

  HayderVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: voice.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 5

      Events:

        VoicePage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /voice
            Method: GET
            Auth:
              Authorizer: NONE

Outputs:

  HayderApiUrl:
    Value: !Sub "https://${HayderApi}.execute-api.${AWS::Region}.amazonaws.com"

  HayderVoiceUrl:
    Value: !Sub "https://${HayderApi}.execute-api.${AWS::Region}.amazonaws.com/voice"

  HayderTableName:
    Value: !Ref HayderMemoryTable

  HayderApprovalTableName:
    Value: !Ref HayderApprovalTable

  HayderUserPoolId:
    Value: !Ref HayderUserPool

  HayderUserPoolClientId:
    Value: !Ref HayderUserPoolClient
