AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hayder Core - secure memory, chat and future voice-ready API

Resources:

  HayderUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: hayder-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  HayderUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: hayder-client
      UserPoolId: !Ref HayderUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  HayderApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: HayderJwtAuthorizer
        Authorizers:
          HayderJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${HayderUserPool}"
              audience:
                - !Ref HayderUserPoolClient

  HayderMemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: record_key
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: record_key
          KeyType: RANGE

  HayderCoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 30

      Environment:
        Variables:
          HAYDER_TABLE: !Ref HayderMemoryTable
          OPENAI_SECRET_NAME: hayder/openai-api-key
          OPENAI_MODEL: gpt-5.6-luna

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt HayderMemoryTable.Arn

            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hayder/openai-api-key-*"

      Events:

        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

        SaveProjectMemory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /memory/project
            Method: POST

        ContinueProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /continue/{project}
            Method: GET

        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref HayderApi
            Path: /chat
            Method: POST

Outputs:

  HayderApiUrl:
    Description: Hayder Core HTTP API URL
    Value: !Sub "https://${HayderApi}.execute-api.${AWS::Region}.amazonaws.com"

  HayderTableName:
    Description: DynamoDB memory table
    Value: !Ref HayderMemoryTable

  HayderUserPoolId:
    Description: Hayder Cognito User Pool ID
    Value: !Ref HayderUserPool

  HayderUserPoolClientId:
    Description: Hayder Cognito App Client ID
    Value: !Ref HayderUserPoolClient
